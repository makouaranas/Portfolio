name: Deploy Backend to Private Server

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload backend code to frontend
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy-key" --exclude '.venv' backend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backend-deploy/

      - name: Deploy from frontend to backend
        run: |
          ssh -i ~/.ssh/deploy-key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SCRIPT'
          rsync -avz -e "ssh -i ~/.ssh/deploy-key" --delete --exclude '.venv' /tmp/backend-deploy/ ubuntu@10.0.1.247:/home/ubuntu/app/
          ssh -i ~/.ssh/deploy-key ubuntu@10.0.1.247 "cd /home/ubuntu/app && export http_proxy=http://10.0.0.233:8888 && export https_proxy=http://10.0.0.233:8888 && source ~/.local/bin/env && uv sync && sudo systemctl restart fastapi"
          rm -rf /tmp/backend-deploy
          SCRIPT