name: Deploy Backend to Private Server

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to backend via jump host
        run: |
          mkdir -p ~/.ssh
          
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          cat > ~/.ssh/config << EOF
          Host frontend
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy-key
            StrictHostKeyChecking no

          Host backend
            HostName ${{ secrets.BACKEND_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy-key
            ProxyJump frontend
            StrictHostKeyChecking no
          EOF
          
          chmod 600 ~/.ssh/config
          
          ssh backend "echo 'Connected!'"
          
          rsync -avz -e ssh --delete --exclude '.venv' backend/ backend:/home/ubuntu/app/
          
          ssh backend "cd /home/ubuntu/app && source ~/.local/bin/env && uv sync && echo 'Dependencies installed!'"